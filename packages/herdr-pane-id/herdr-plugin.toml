id = "local.pane-id"
name = "Agent number / pane ID sidebar"
version = "0.4.0"
min_herdr_version = "0.9.1"
description = "Agent rows as \"<n> <workspace> · <tab>\" via state labels; $pane_id and $ws_num tokens"
platforms = ["linux", "macos"]

[[startup]]
command = ["node", "sync.mjs"]

[[events]]
on = "pane.created"
command = ["node", "sync.mjs"]

[[events]]
on = "pane.closed"
command = ["node", "sync.mjs"]

[[events]]
on = "pane.exited"
command = ["node", "sync.mjs"]

[[events]]
on = "pane.moved"
command = ["node", "sync.mjs"]

[[events]]
on = "pane.agent_detected"
command = ["node", "sync.mjs"]

[[events]]
on = "tab.renamed"
command = ["node", "sync.mjs"]

[[events]]
on = "tab.closed"
command = ["node", "sync.mjs"]

[[events]]
on = "tab.moved"
command = ["node", "sync.mjs"]

[[events]]
on = "workspace.created"
command = ["node", "sync.mjs"]

[[events]]
on = "workspace.renamed"
command = ["node", "sync.mjs"]

[[events]]
on = "workspace.closed"
command = ["node", "sync.mjs"]

[[events]]
on = "workspace.moved"
command = ["node", "sync.mjs"]

[[events]]
on = "workspace.reordered"
command = ["node", "sync.mjs"]

[[actions]]
id = "sync"
title = "Refresh agent numbers / pane ids"
contexts = ["workspace"]
command = ["node", "sync.mjs"]
