id = "local.pane-id"
name = "Agent number / pane ID sidebar"
version = "0.6.0"
min_herdr_version = "0.9.1"
description = "Numbers agents 1..N (state_text, state-colored) and reports $pane_id (w1:p3) for the sidebar"
platforms = ["linux", "macos"]

[[startup]]
command = ["node", "sync.mjs"]

[[events]]
on = "pane.created"
command = ["node", "sync.mjs"]

[[events]]
on = "pane.closed"
command = ["node", "sync.mjs"]

[[events]]
on = "pane.exited"
command = ["node", "sync.mjs"]

[[events]]
on = "pane.moved"
command = ["node", "sync.mjs"]

[[events]]
on = "pane.agent_detected"
command = ["node", "sync.mjs"]

[[events]]
on = "tab.closed"
command = ["node", "sync.mjs"]

[[events]]
on = "tab.moved"
command = ["node", "sync.mjs"]

[[events]]
on = "workspace.created"
command = ["node", "sync.mjs"]

[[events]]
on = "workspace.closed"
command = ["node", "sync.mjs"]

[[events]]
on = "workspace.moved"
command = ["node", "sync.mjs"]

[[events]]
on = "workspace.reordered"
command = ["node", "sync.mjs"]

[[actions]]
id = "sync"
title = "Refresh agent numbers / pane ids"
contexts = ["workspace"]
command = ["node", "sync.mjs"]
