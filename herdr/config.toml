onboarding = false

[terminal]
default_shell = "/bin/zsh"

[keys]
prefix = "ctrl+q"
focus_pane_up = "prefix+k"
focus_pane_down = "prefix+j"
focus_pane_left = "prefix+left"
focus_pane_right = "prefix+right"
previous_agent = "prefix+up"
next_agent = "prefix+down"
last_pane = "prefix+o"
switch_tab = ""
focus_agent = "prefix+1..9"

[theme]
name = "tokyo-night"
auto_switch = false

# Agent state colors: idle green (#9ece6a), working orange (tokyo-night yellow
# #e0af68 is too close to green), blocked red, done blue (teal #73daca is too).
[theme.custom]
yellow = "#ff9e64"
teal = "#7aa2f7"

# Agent rows: "<n> <workspace> · <tab>" as one state-colored token, so the number
# replaces the state dot with no " · " after it. Labels come from the herdr plugin
# local.pane-id (packages/herdr-pane-id); while a pi prompt waits, pi replaces the
# whole row with "<n> plan ready" / "<n> approval" (herdr-ui-prompt-blocked.ts).
[ui.sidebar.agents]
rows = [
  [{ token = "state_text", bold = true }, "machine"],
  ["agent", { token = "$pane_id", dim = true }],
]

[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "$ws_num", fg = "#e0af68" }, "workspace"],
  ["branch", "git_status"],
]
